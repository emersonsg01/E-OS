source /boot/grub/config.cfg

menuentry "Experimentar o E OS (sem instalar)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Instalar o E OS" --hotkey=i {
	linux	@KERNEL_GI@ vga=788 @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_GI@
}

menuentry "Instalar o E OS (modo texto)" --hotkey=t {
	linux	@KERNEL_DI@ vga=788 @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_DI@
}

submenu "Mais opções..." --hotkey=o {
	source /boot/grub/theme.cfg

	menuentry "Experimentar o E OS (modo seguro)" --hotkey=m {
		linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
		initrd	@INITRD_LIVE@
	}

	menuentry "Reparar um sistema instalado" --hotkey=r {
		linux	@KERNEL_DI@ rescue/enable=true vga=788 @APPEND_INSTALL@ --- quiet
		initrd	@INITRD_DI@
	}

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "Configurações do firmware (UEFI)" --hotkey=f {
			fwsetup
		}
	fi
}
