label installgui
	menu label ^Instalar o E OS
	linux @KERNEL_GI@
	initrd @INITRD_GI@
	append vga=788 @APPEND_INSTALL@ --- quiet

label installtext
	menu label Instalar o E OS (modo ^texto)
	linux @KERNEL_DI@
	initrd @INITRD_DI@
	append vga=788 @APPEND_INSTALL@ --- quiet

label rescue
	menu label ^Reparar um sistema instalado
	linux @KERNEL_DI@
	initrd @INITRD_DI@
	append rescue/enable=true vga=788 @APPEND_INSTALL@ --- quiet
