# E OS: cores e textos do menu BIOS. Cores no formato #AARRGGBB.
# Só ASCII aqui: a fonte do menu BIOS não tem todos os acentos.
menu background splash.png
menu color title	* #ffffffff *
menu color border	* #00000000 #00000000 none
menu color sel		* #ffffffff #c04f8cff *
menu color hotsel	1;7;37;40 #ffffffff #c04f8cff *
menu color unsel	* #ffc9d1d9 #00000000 none
menu color hotkey	* #ff4f8cff #00000000 none
menu color tabmsg	* #ff9aa4b2 #00000000 none
menu color timeout_msg	* #ff9aa4b2 #00000000 none
menu color timeout	* #ffffffff #00000000 none
menu color help		37;40 #ffdddd00 #00000000 none
menu vshift 12
menu rows 6
menu helpmsgrow 15
menu cmdlinerow 16
menu timeoutrow 16
menu tabmsgrow 18
menu tabmsg ENTER inicia, TAB edita a linha de boot
menu autoboot Iniciando em # s
