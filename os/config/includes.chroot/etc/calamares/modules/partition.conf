---
# E OS: particionamento no instalador gráfico.
# Padrão: apagar o disco escolhido, ext4 e sem swap (o E OS usa zram, uma
# swap comprimida na própria memória). Partição EFI só nos PCs UEFI.
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

userSwapChoices:
    - none
    - file
initialSwapChoice: none
initialPartitioningChoice: erase

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

# LUKS1: o GRUB do Debian 13 abre LUKS1 sem problemas.
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
