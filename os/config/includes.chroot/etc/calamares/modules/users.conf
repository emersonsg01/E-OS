---
# E OS: usuário criado na instalação. Sem senha de root: o primeiro usuário
# administra o sistema com sudo.
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    # dictcheck=0: sem a checagem de dicionário. A imagem não traz o
    # dicionário de senhas fracas, e sem ele toda senha seria recusada
    # ("error loading dictionary").
    libpwquality:
        - minlen=0
        - minclass=0
        - dictcheck=0
