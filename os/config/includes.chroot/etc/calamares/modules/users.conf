---
# E OS: usuário criado na instalação. Sem senha de root: o primeiro usuário
# administra o sistema com sudo.
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
