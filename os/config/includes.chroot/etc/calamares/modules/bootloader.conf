---
# E OS: carregador de boot (GRUB). Igual ao do Debian, com uma diferença:
# a pasta EFI fica fixa em "debian". O GRUB assinado do Debian (que funciona
# com Secure Boot) procura a configuração em EFI/debian; com o nome "E OS"
# o PC com Secure Boot não ligaria. O nome do menu do GRUB continua "E OS".
efiBootLoader: "grub"
efiBootloaderId: "debian"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
