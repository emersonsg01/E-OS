---
# E OS: tela de boas-vindas do instalador gráfico.
showSupportUrl:      false
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    # 8 GB de disco. RAM de 0,9 GB porque uma máquina de 1 GB enxerga um
    # pouco menos que isso (parte fica com o vídeo e o firmware).
    requiredStorage: 8
    requiredRam:     0.9
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
