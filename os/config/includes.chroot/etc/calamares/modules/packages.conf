---
# E OS: pacotes da sessão live que saem do sistema instalado.
# Só pacotes que existem na imagem: a ISO do E OS não traz os índices do apt,
# então um nome que não está instalado faria o apt parar com erro.
backend: apt
operations:
  - remove:
      - 'live-boot'
      - 'live-config'
      - 'live-config-systemd'
      - 'user-setup'
      - 'calamares-settings-debian'
      - 'calamares'
