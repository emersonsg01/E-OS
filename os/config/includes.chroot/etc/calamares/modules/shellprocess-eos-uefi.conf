---
# E OS: completa o carregador de boot nos PCs UEFI.
#
# O passo do Debian (bootloader-config) instala só o pacote grub-efi. O
# efibootmgr (que grava a entrada de boot na memória do firmware) e os pacotes
# de Secure Boot (shim-signed e grub-efi-amd64-signed) entram no Debian como
# "recomendados", e o E OS não instala recomendados. Sem eles, o grub-install
# falha ao registrar o boot e o sistema não liga com o Secure Boot ativo.
#
# Roda dentro do sistema novo, antes do grub-install. Os pacotes vêm da
# própria ISO (o passo sources-media já a configurou como fonte do apt).
dontChroot: false
timeout: 600
script:
    - command: "if [ -d /sys/firmware/efi/efivars ]; then DEBIAN_FRONTEND=noninteractive apt-get -y install efibootmgr grub-efi-amd64-signed shim-signed; fi"
      timeout: 600
i18n:
    name: "Preparando o boot UEFI"
