# E OS Fusão: busca de apps (Fuzzel), no estilo do Spotlight do macOS e da
# busca do ChromeOS: uma caixa no centro da tela que filtra enquanto você digita.
[main]
font=Inter:size=14,FontAwesome:size=14
prompt="›  "
placeholder=Pesquisar apps
icon-theme=Adwaita
icons-enabled=yes
terminal=foot -e
anchor=center
lines=8
width=34
horizontal-pad=26
vertical-pad=20
inner-pad=12
line-height=34
layer=overlay

[colors]
background=111620f2
text=c9d1d9ff
prompt=4f8cffff
placeholder=6e7681ff
input=e6edf3ff
match=8fb3ffff
selection=4f8cff38
selection-text=ffffffff
selection-match=ffffffff
counter=6e7681ff
border=ffffff1f

[border]
width=1
radius=22
