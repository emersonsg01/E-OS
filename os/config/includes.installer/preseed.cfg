# E OS: respostas padrão do instalador (Debian Installer).
#
# O instalador continua perguntando idioma, região, teclado, fuso horário,
# disco, nome da máquina e usuário. Aqui ficam só os valores sugeridos e o
# que não precisa ser perguntado.

# Português do Brasil já vem selecionado na lista de idiomas (dá para trocar).
d-i localechooser/languagelist select pt_BR
d-i localechooser/languagelist seen false

# Nome da máquina sugerido (a pergunta continua aparecendo) e sem domínio.
d-i netcfg/get_hostname string eos
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string

# Sem senha de root: o primeiro usuário administra o sistema com sudo.
d-i passwd/root-login boolean false

# Particionamento assistido do E OS: partição EFI (só no UEFI), /boot só nos
# modos com LVM, e a raiz com o resto do disco, a partir de 4 GB. Sem partição
# de swap: o E OS usa zram (swap comprimida na RAM). O esquema padrão do
# Debian pede 8 GB só para a raiz e falha em discos pequenos no UEFI.
# A receita certa (BIOS ou UEFI) é escolhida assim que o instalador liga.
d-i preseed/early_command string if [ -d /sys/firmware/efi ]; then cp /usr/share/eos/particionamento-uefi /tmp/eos-particionamento; else cp /usr/share/eos/particionamento-bios /tmp/eos-particionamento; fi
d-i partman-auto/expert_recipe_file string /tmp/eos-particionamento
d-i partman-basicfilesystems/no_swap boolean false

# Espelho de pacotes padrão do Debian, sem perguntar.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

# Sem tarefas extras e sem atualizar pacotes durante a instalação.
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none

# Sem telemetria.
popularity-contest popularity-contest/participate boolean false
