# Respostas do teste automático de instalação (só para tools/test-instalacao.sh;
# não vão para a ISO). Somadas às respostas padrão do E OS.

# Idioma, região e teclado
d-i debian-installer/locale string pt_BR.UTF-8
d-i debian-installer/country string BR
d-i localechooser/languagelist select pt_BR
d-i localechooser/languagelist seen true
d-i keyboard-configuration/xkb-keymap select br

# Rede e nome da máquina
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string eos-teste
d-i netcfg/get_hostname seen true

# Usuário de teste
d-i passwd/user-fullname string Teste do E OS
d-i passwd/username string teste
d-i passwd/user-password password teste123
d-i passwd/user-password-again password teste123
d-i user-setup/allow-password-weak boolean true

# Fuso horário
d-i time/zone string America/Sao_Paulo
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

# Disco: usa o disco virtual inteiro, com o esquema do E OS (preseed padrão)
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string regular
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Carregador de boot e fim
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda

# Liga o console serial no sistema instalado, para o teste de boot entrar por ele.
d-i preseed/late_command string in-target sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT="\(.*\)"/GRUB_CMDLINE_LINUX_DEFAULT="\1 console=tty0 console=ttyS0,115200n8"/' /etc/default/grub; in-target update-grub
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
