  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a2240"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="interno" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="24" fill="url(#fundo)"/>
  <rect width="800" height="300" rx="24" fill="url(#brilho)"/>

