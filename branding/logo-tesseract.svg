<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100">
  <!-- Logo do E OS: um tesserato, o hipercubo de 4 dimensões, desenhado do
       jeito clássico: um cubo dentro de outro, com os vértices ligados.
       Arquivo-mestre; as outras artes usam as mesmas linhas. -->
  <defs>
    <linearGradient id="interno" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ligações entre os cubos -->
    <path d="M12 32L32.9 41.9M68 32L58.1 41.9M68 88L58.1 67.1M12 88L32.9 67.1M32 12L41.9 32.9M88 12L67.1 32.9M88 68L67.1 58.1M32 68L41.9 58.1"
          stroke="#8fb3ff" stroke-opacity="0.55" stroke-width="1.6"/>
    <!-- cubo externo -->
    <path d="M12 32H68V88H12ZM32 12H88V68H32ZM12 32L32 12M68 32L88 12M68 88L88 68M12 88L32 68"
          stroke="#e6edf3" stroke-width="2.6"/>
    <!-- cubo interno -->
    <path d="M32.9 41.9H58.1V67.1H32.9ZM41.9 32.9H67.1V58.1H41.9ZM32.9 41.9L41.9 32.9M58.1 41.9L67.1 32.9M58.1 67.1L67.1 58.1M32.9 67.1L41.9 58.1"
          stroke="url(#interno)" stroke-width="2.6"/>
  </g>
</svg>
